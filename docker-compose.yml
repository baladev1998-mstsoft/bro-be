version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin@123}
      POSTGRES_DB: ${POSTGRES_DB:-brodb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_SERVER: db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin@123}
      DB_NAME: ${POSTGRES_DB:-brodb}
      MIGRATE: "0" # web container won't run alembic; migration job handles it
      APP_MODULE: ${APP_MODULE:-app.main:app}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app # optional for dev to see code changes; remove for strict prod
    restart: on-failure

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_SERVER: db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin@123}
      DB_NAME: ${POSTGRES_DB:-brodb}
      MIGRATE: "1"
      APP_MODULE: ${APP_MODULE:-app.main:app}
    entrypoint: [ "/entrypoint.sh" ]
    # run once and exit
    restart: "no"

volumes:
  pgdata:
